<!doctype html>
<!-- Standalone page of the UMAP explorer, to test it outside the blog. Not copied to the blog.
     Serve this folder (cd blog && python -m http.server) and open http://localhost:8000/umap_explorer_standalone.html
     Append ?dark to check the dark theme. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMAP explorer (standalone)</title>
  <link rel="stylesheet" href="assets/css/umap/umap_explorer.css">
  <script defer src="https://cdn.jsdelivr.net/npm/plotly.js-gl3d-dist-min@2.35.2/plotly-gl3d.min.js"></script>
  <script defer src="assets/js/umap/umap_explorer.js"></script>
  <style>
    body { max-width: 900px; margin: 20px auto; padding: 0 16px; font-family: sans-serif; background: #fff; color: #34343c; }
    body.dark { background: rgb(27 27 30); color: rgb(175 176 177); }
  </style>
  <script>document.addEventListener("DOMContentLoaded", () => location.search.includes("dark") && document.body.classList.add("dark"));</script>
</head>
<body>
<figure class="umap-explorer" data-src="assets/data/umap/umap_explorer">
  <div class="ux-panels">
    <div class="ux-col">
      <div class="ux-label">Original data (3-D, drag to rotate)</div>
      <div class="ux-plot ux-3d"></div>
      <div class="ux-shapes" role="group" aria-label="Dataset"></div>
    </div>
    <div class="ux-col">
      <div class="ux-label">UMAP (2-D)</div>
      <div class="ux-plot ux-2d"></div>
      <div class="ux-controls">
        <label>
          <span>n_neighbors <output class="ux-k-value"></output></span>
          <input type="range" class="ux-k" min="0" step="1">
        </label>
        <label>
          <span>min_dist <output class="ux-md-value"></output></span>
          <input type="range" class="ux-md" min="0" step="1">
        </label>
      </div>
    </div>
  </div>
  <figcaption><em>Placeholder caption.</em></figcaption>
</figure>
</body>
</html>
